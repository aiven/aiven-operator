name: unit-tests

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch/tag/SHA) to checkout. Defaults to the calling workflow's ref.
        required: false
        type: string
        default: ""

jobs:
  unit-tests:
    if: ${{ !(github.event.action == 'opened' && startsWith(github.head_ref, 'release-v') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:unit
