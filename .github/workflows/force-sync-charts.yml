name: force sync charts

on:
  workflow_dispatch: {}

jobs:
  sync-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned to an SHA: this step receives a long-lived PAT.
      # So a moved tag on a third-party action could be a security risk.
      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1
        with:
          GH_PAT: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}
          COMMIT_PREFIX: "chore:"
