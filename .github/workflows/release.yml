# Manual release: builds and publishes artifacts on a push a v* tag directly.
# The normal path is prepare-release.yml -> publish-release.yml, which tags on release PR merge.
#
# This never fires for the automated path, because a tag pushed with GITHUB_TOKEN
# triggers no workflows.
name: release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The default shell has no pipefail, so piping into grep would report the
          # pipeline's status as grep's: a failing `gh api` would look like "no
          # release exists" and the guard would fail OPEN. Capture first so an API
          # error aborts.
          set -euo pipefail
          releases=$(gh api --paginate "repos/$REPO/releases" --jq '.[].tag_name')

          # Listing, not GET /releases/tags/{tag}, which 404s on drafts — and a
          # draft is exactly the case this guard exists to catch.
          #
          # Recovery: a failed run leaves that draft behind, so re-pushing the tag
          # lands here and is skipped by design. Use "Re-run failed jobs" on the
          # original run instead; only delete the draft to rebuild from scratch.
          if grep -qxF "$TAG" <<<"$releases"; then
            echo "::notice::Release $TAG already exists, so publish-release.yml owns this tag. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release for $TAG yet, publishing artifacts for this manual tag push."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  artifacts:
    needs: guard
    if: needs.guard.outputs.should_publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-artifacts.yml
    with:
      tag: ${{ github.ref_name }}
      # Left a draft on purpose: the manual flow in release.md has a human paste the
      # changelog into the release and publish it (step 5). Auto-publishing here
      # would ship the autogenerated notes instead and remove that step.
      publish: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}

  # The repository check keeps a fork's rehearsal out of the team's Slack.
  notify-slack-failure:
    needs:
      - guard
      - artifacts
    if: failure() && github.repository == 'aiven/aiven-operator'
    permissions:
      contents: read
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: failure
      workflow_name: release
      custom_message: >-
        ${{ needs.artifacts.outputs.published == 'true'
        && format('Manual tag-push release {0} IS published, but the charts sync failed — open that PR by hand', github.ref_name)
        || format('Manual tag-push release failed for {0}', github.ref_name) }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
