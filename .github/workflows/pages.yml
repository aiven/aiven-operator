name: pages

on:
  workflow_dispatch: {}
  push:
    tags:
      - v*

jobs:
  release_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate docs
        uses: addnab/docker-run-action@v3
        with:
          image: zensical/zensical:latest
          options: -v ${{ github.workspace }}/docs/:/docs
          run: zensical build --clean
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/site

  notify-slack-failure:
    needs: release_pages
    # Keeps a fork building its own docs out of the team's Slack.
    if: failure() && github.repository == 'aiven/aiven-operator'
    permissions:
      contents: read
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: failure
      workflow_name: pages
      custom_message: >-
        Docs site build failed for ${{ github.ref_name }} — the site is still
        serving the previous version
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
