name: Report commit job statuses
description: Report commit statuses for CI checks on automated PRs

inputs:
  sha:
    description: The commit SHA to report statuses for
    required: true
  statuses:
    description: >-
      JSON object mapping check context names to results. A literal "pending"
      reports the pending state, for marking checks in progress up front.
      Example: {"commitlint": "success", "trunk": "failure"}
    required: true
  success_on_skip:
    description: >-
      Comma-separated contexts to report green when their result is "skipped".
      Everything else fails closed: anything other than an explicit "success" is a
      failure. A reusable workflow returns an EMPTY output when the job behind it
      failed or was skipped, so an omitted result must never pass.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        COMMIT_SHA: ${{ inputs.sha }}
        STATUSES: ${{ inputs.statuses }}
        SUCCESS_ON_SKIP: ${{ inputs.success_on_skip }}
      with:
        script: |
          const sha = process.env.COMMIT_SHA;
          const statuses = JSON.parse(process.env.STATUSES);
          const skipOk = new Set(
            (process.env.SUCCESS_ON_SKIP || '')
              .split(',')
              .map((s) => s.trim())
              .filter(Boolean)
          );
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          for (const [name, result] of Object.entries(statuses)) {
            const ok = result === 'success' || (skipOk.has(name) && result === 'skipped');
            // Only the literal "pending" maps to pending.
            const state = result === 'pending' ? 'pending' : ok ? 'success' : 'failure';
            console.log(`Reporting ${name}: ${result || '<empty>'} -> ${state}`);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: name,
              description: `${name} ${result || 'no result'}`,
              target_url: runUrl
            });
          }
