name: Feature request
description: Propose a new resource, field, or behavior change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please wait for a maintainer to label this issue `accepted` before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the operator does not support it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. How you would like it to work, for example an example manifest.
