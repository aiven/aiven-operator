---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: serviceuserrotations.aiven.io
spec:
  group: aiven.io
  names:
    kind: ServiceUserRotation
    listKind: ServiceUserRotationList
    plural: serviceuserrotations
    singular: serviceuserrotation
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.serviceName
          name: Service Name
          type: string
        - jsonPath: .spec.project
          name: Project
          type: string
        - jsonPath: .status.activeUsername
          name: Active User
          type: string
        - jsonPath: .status.nextRotationAt
          name: Next Rotation
          type: date
        - jsonPath: .spec.connInfoSecretTarget.name
          name: Connection Information Secret
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            ServiceUserRotation rotates credentials between two Aiven service users and publishes
            the active user's connection details and credentials through a stable Kubernetes Secret.
            Users and their permissions must be managed separately. For ServiceUser resources,
            leave connInfoSecretSource unset and set connInfoSecretTargetDisabled to true at creation.
            Passwords are generated by the operator and sent to Aiven during rotation.
            The active user's password is not repaired if it changes or the user is recreated.
            See [Service user rotation](../guides/serviceuser-rotation.md) for lifecycle and limitations.

            Reading connection details also requires `service:secrets:read` for ServiceGet with `include_secrets=true`.

            Info "Exposes secret keys": `SERVICEUSER_HOST`, `SERVICEUSER_PORT`, `SERVICEUSER_USERNAME`, `SERVICEUSER_PASSWORD`, `SERVICEUSER_CA_CERT`, `SERVICEUSER_ACCESS_CERT`, `SERVICEUSER_ACCESS_KEY`, `SERVICEUSER_SASL_HOST`, `SERVICEUSER_SASL_PORT`, `SERVICEUSER_SCHEMA_REGISTRY_HOST`, `SERVICEUSER_SCHEMA_REGISTRY_PORT`
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: ServiceUserRotationSpec defines the desired state of ServiceUserRotation.
              properties:
                authSecretRef:
                  description: Authentication reference to Aiven token in a secret
                  properties:
                    key:
                      minLength: 1
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                connInfoSecretTarget:
                  description: |-
                    ConnInfoSecretTarget specifies the dedicated Kubernetes Secret that stores the active connection details
                    and credentials. The Secret is controlled by this resource and must not be shared.
                    A name is required; the name and effective key prefix are immutable. An empty prefix defaults to SERVICEUSER_.
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      description: Annotations added to the secret
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels added to the secret
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description:
                        Name of the secret resource to be created. By default,
                        it is equal to the resource name
                      type: string
                      x-kubernetes-validations:
                        - message: Value is immutable
                          rule: self == oldSelf
                    prefix:
                      description: |-
                        Prefix for the secret's keys.
                        Added "as is" without any transformations.
                        By default, is equal to the kind name in uppercase + underscore, e.g. `KAFKA_`, `REDIS_`, etc.
                      type: string
                  required:
                    - name
                  type: object
                project:
                  description: Identifies the project this resource belongs to
                  maxLength: 63
                  pattern: ^[a-zA-Z0-9_-]+$
                  type: string
                  x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self == oldSelf
                rotationInterval:
                  description: |-
                    RotationInterval is the minimum time between scheduled credential rotations.
                    Measured from the publication time saved in the connection Secret. Must be at least one hour.
                  type: string
                  x-kubernetes-validations:
                    - message: rotationInterval must be at least 1h.
                      rule: duration(self) >= duration('1h')
                serviceName:
                  description:
                    Specifies the name of the service that this resource
                    belongs to
                  maxLength: 63
                  pattern: ^[a-z][-a-z0-9]+$
                  type: string
                  x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self == oldSelf
                usernames:
                  description: |-
                    Usernames lists two existing Aiven service users in rotation order.
                    Create the users and configure their permissions before enabling rotation.
                    This resource does not create or delete users or manage their permissions.
                  items:
                    maxLength: 64
                    minLength: 1
                    type: string
                  maxItems: 2
                  type: array
                  x-kubernetes-validations:
                    - message: usernames must contain exactly two users.
                      rule: size(self) == 2
                    - message: usernames must be unique.
                      rule: self.all(x, self.exists_one(y, y == x))
                    - message: avnadmin cannot be managed by ServiceUserRotation.
                      rule: self.all(username, username != 'avnadmin')
                    - message: usernames is immutable.
                      rule: self == oldSelf
              required:
                - connInfoSecretTarget
                - project
                - rotationInterval
                - serviceName
                - usernames
              type: object
              x-kubernetes-validations:
                - message: connInfoSecretTarget.name must not be empty.
                  rule: size(self.connInfoSecretTarget.name) > 0
                - message: connInfoSecretTarget.name is immutable.
                  rule: self.connInfoSecretTarget.name == oldSelf.connInfoSecretTarget.name
                - message: connInfoSecretTarget.prefix is immutable.
                  rule:
                    "(has(self.connInfoSecretTarget.prefix) && size(self.connInfoSecretTarget.prefix)
                    > 0 ? self.connInfoSecretTarget.prefix : 'SERVICEUSER_') == (has(oldSelf.connInfoSecretTarget.prefix)
                    && size(oldSelf.connInfoSecretTarget.prefix) > 0 ? oldSelf.connInfoSecretTarget.prefix
                    : 'SERVICEUSER_')"
            status:
              description:
                ServiceUserRotationStatus reports observations of the users
                and published connection Secret.
              properties:
                activeUsername:
                  description:
                    ActiveUsername is the Aiven service user whose credentials
                    are currently published in the connection Secret.
                  type: string
                conditions:
                  description:
                    Conditions represent the latest available observations
                    of the resource's state.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                lastRotationAt:
                  description: |-
                    LastRotationAt is the publication time recorded in the connection Secret, when the current rotation interval began.
                    Refreshing connection details does not reset it.
                  format: date-time
                  type: string
                nextRotationAt:
                  description:
                    NextRotationAt is the scheduled time for the next credential
                    rotation.
                  format: date-time
                  type: string
              required:
                - conditions
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
